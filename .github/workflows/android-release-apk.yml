name: Android Release APK

# Builds an installable, signed release APK for the Windscribe Android app.
#
# Signing: the repo's config/config.gradle reads config/sign.properties and, when it
# names a keystore, signs the `release` build type with it. config/sign.properties is
# not tracked, so this workflow generates one. By default it creates a throwaway
# keystore using the standard Android debug identity, which produces a release/minified
# APK that installs on any device. Set the RELEASE_KEYSTORE_* secrets to sign with a
# real release keystore instead.
#
# The APK is always signed, so it can be installed over USB or sideloaded. It is not
# suitable for Play Store upload unless signed with the real upload key.
#
# Optional secrets:
#   RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD,
#   RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD   -> real release signing
#   BUILD_PROPERTIES_BASE64                   -> real API keys (see config/build.properties)
#   CLOUD_PROJECT_NUMBER                      -> Play Integrity project number (google flavor)

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Product flavor to build"
        type: choice
        options: [google, fdroid]
        default: fdroid
      abi_filters:
        description: "Comma-separated ABIs. Use all four for a universal APK."
        type: string
        default: "arm64-v8a,armeabi-v7a"
      build_tv:
        description: "Also build the Android TV APK"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the ndkVersion in the module build scripts and the SDK in build.gradle.kts.
  NDK_VERSION: "27.2.12479018"
  # The repo's .cxx cache and ci/android-deploy.Dockerfile both pin CMake 3.22.1.
  CMAKE_VERSION: "3.22.1"
  ANDROID_PLATFORM: "android-36"
  BUILD_TOOLS_VERSION: "36.0.0"

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # openvpn's CMake runs `git describe`; a full clone keeps the version string clean.
          fetch-depth: 0
          submodules: false

      - name: Free disk space
        run: |
          set -euo pipefail
          # SDK + NDK + a multi-ABI OpenSSL/OpenVPN build is tight on the default runner.
          # The pre-installed NDK is removed here and reinstalled at the pinned version.
          sudo rm -rf \
            /usr/local/lib/android/sdk/ndk \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          set -euo pipefail
          # `yes` dies on SIGPIPE when sdkmanager stops reading; with pipefail that would
          # fail the step, hence the explicit success.
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          # swig generates the OpenVPN3 JNI bindings; the wireguard-go Makefile needs
          # flock and patch, both already present on the runner image.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swig

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Resolve build inputs
        run: |
          set -euo pipefail
          flavor="${{ inputs.flavor || 'google' }}"
          # Capitalise for the Gradle task name (google -> Google).
          variant="$(tr '[:lower:]' '[:upper:]' <<< "${flavor:0:1}")${flavor:1}"
          {
            echo "FLAVOR=${flavor}"
            echo "VARIANT=${variant}"
            echo "ABI_FILTERS=${{ inputs.abi_filters || 'arm64-v8a,armeabi-v7a' }}"
            echo "BUILD_TV=${{ inputs.build_tv || 'false' }}"
          } >> "$GITHUB_ENV"

      - name: Prepare signing keystore
        env:
          # Optional. When set, these describe a real release keystore and take
          # precedence over the generated debug-identity fallback.
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$GITHUB_WORKSPACE/release.jks"
          if [ -n "${RELEASE_KEYSTORE_BASE64}" ]; then
            echo "Using release keystore from secrets."
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$keystore"
            store_password="$RELEASE_KEYSTORE_PASSWORD"
            key_alias="$RELEASE_KEY_ALIAS"
            key_password="${RELEASE_KEY_PASSWORD:-$RELEASE_KEYSTORE_PASSWORD}"
          else
            echo "No release keystore secret; signing with a generated debug identity."
            keytool -genkeypair \
              -keystore "$keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            store_password="android"
            key_alias="androiddebugkey"
            key_password="android"
          fi
          # Absolute path: config.gradle resolves the store relative to whichever module
          # applies it, not to config/.
          cat > config/sign.properties <<EOF
          SIGN_KEY_FILE=$keystore
          SIGN_STORE_PASSWORD=$store_password
          SIGN_KEY_ALIAS=$key_alias
          SIGN_KEY_PASSWORD=$key_password
          EOF

      - name: Apply API configuration
        env:
          # Optional. config/build.properties ships with empty API keys, which builds a
          # launchable but non-functional app. A real build.properties (base64) overrides it.
          BUILD_PROPERTIES_BASE64: ${{ secrets.BUILD_PROPERTIES_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${BUILD_PROPERTIES_BASE64}" ]; then
            printf '%s' "$BUILD_PROPERTIES_BASE64" | base64 -d > config/build.properties
            echo "Applied build.properties from secrets."
          else
            echo "No build.properties secret; using the checked-in defaults (API keys empty)."
          fi

      - name: Assemble release APKs
        env:
          CLOUD_PROJECT_NUMBER: ${{ secrets.CLOUD_PROJECT_NUMBER }}
        run: |
          set -euo pipefail
          tasks=":mobile:assemble${VARIANT}Release"
          if [ "${BUILD_TV}" = "true" ]; then
            tasks="${tasks} :tv:assemble${VARIANT}Release"
          fi
          echo "Running: ./gradlew ${tasks} -PabiFilter=${ABI_FILTERS}"
          ./gradlew ${tasks} \
            -PabiFilter="${ABI_FILTERS}" \
            --stacktrace

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          apksigner="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner"
          aapt2="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/aapt2"
          mapfile -t apks < <(find mobile/build/outputs/apk tv/build/outputs/apk \
            -type f -path "*/${FLAVOR}/release/*.apk" 2>/dev/null | sort)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No release APKs found" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "== ${apk}"
            "$apksigner" verify --verbose --print-certs "$apk"
            "$aapt2" dump badging "$apk" | grep -E "^(package|application-label|native-code)"
          done

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          while IFS= read -r apk; do
            cp "$apk" dist/
          done < <(find mobile/build/outputs/apk tv/build/outputs/apk \
            -type f -path "*/${FLAVOR}/release/*.apk" 2>/dev/null)
          # ProGuard/R8 mapping lets you symbolicate release crash reports.
          while IFS= read -r mapping; do
            cp "$mapping" "dist/$(basename "$(dirname "$mapping")")-mapping.txt"
          done < <(find mobile/build/outputs/mapping tv/build/outputs/mapping \
            -type f -path "*${VARIANT}Release/mapping.txt" 2>/dev/null)
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: windscribe-${{ env.FLAVOR }}-release
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" > /dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" dist/*.apk --clobber
